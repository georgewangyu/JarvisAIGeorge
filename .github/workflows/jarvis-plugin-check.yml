name: jarvis-plugin-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Jarvis plugin build, skills, scrub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generated adapters match sources, frontmatter, duplicate skill names, version bumped
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 tools/jarvis-build.py --check --base "$BASE"
      - name: Bitter-lesson tags
        run: python3 plugins/jarvis-ai-george/skills/principles-bitter-lesson/scripts/bitter_lesson.py check --root plugins/jarvis-ai-george
      - name: Skill script tests
        run: |
          set -eu
          python3 -m unittest discover -s plugins/jarvis-ai-george/skills/principles-bitter-lesson/tests
          python3 -m unittest discover -s plugins/jarvis-ai-george/skills/mistake-miner/tests
      - name: Setup check, manager write guard, Codex manifests
        run: |
          set -eu
          bash tests/jarvis-setup.test.sh
          bash tests/jarvis-manager-write-guard.test.sh
          bash tests/jarvis-launch.test.sh
          bash tests/jarvis-sidebar-hook.test.sh
          bash tests/jarvis-plugin-versioning.test.sh
          bash tests/jarvis-hook-pinning.test.sh
          bash tests/jarvis-new-extension.test.sh
          bash tests/jarvis-home-discovery.test.sh
          bash tests/jarvis-worker-titles.test.sh
      - name: AGENTS.md fits the project-document budget
        run: bash tests/fm-agents-md-size.test.sh
      - name: Skill listing budget and catalog diagnostic
        run: |
          set -eu
          bash tests/jarvis-skill-budget.test.sh
          bash tests/fm-skill-catalog-check.test.sh
          bash tests/jarvis-codex-manifests.test.sh
      - name: Scrub (public marker list)
        run: tools/scrub-lint/scripts/scrub-lint check --lists public
