name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Per-PR supersession: a new push to the same PR replaces that PR's in-flight
# CI instead of letting superseded heads keep the full hosted-runner fan-out.
# The group uses the PR number for pull_request events, so every run of one PR
# shares a group, and falls back to the unique run id for push events, so each
# main push gets its own group and is never cancelled. Cancellation is likewise
# limited to pull_request events. Evidence and rationale: the September 12
# Actions starvation report, section 3 "Workflow mechanics to ship first".
# The compliance workflow deliberately keeps its own event-specific groups; do
# not collapse it onto this simpler shape.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Timeout policy: docs/fm-test-portable-shards.md "Timeouts" owns the three
# tiers and their rationale; tests/fm-ci-workflow.test.sh guards this workflow.
# Each job comment identifies the tier implemented by its executable value.

jobs:
  lint:
    name: Lint ${{ matrix.partition }}
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (shell file set, config, version,
      # and GitHub workflow lint). Do not re-spell the checks here; keep CI
      # and the pre-push gate on this script so a self-broken ci.yml still
      # fails locally before merge.
      - name: Lint canonical partition
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-lint"
          bin/fm-lint.sh --partition "${{ matrix.partition }}of${{ strategy.job-total }}" \
            --telemetry "$RUNNER_TEMP/fm-lint/partition-${{ matrix.partition }}.tsv"
      - name: Upload lint telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-lint-telemetry-${{ matrix.partition }}
          path: ${{ runner.temp }}/fm-lint/partition-${{ matrix.partition }}.tsv
          if-no-files-found: warn

  # Deterministic proof that portable parallel shards + portable serial + Herdr
  # equal the complete tests/*.test.sh inventory with no missing or duplicates,
  # and that the portable serial CI shards partition that serial lane exactly.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    # Fast tier: the coverage guard is a seconds-long local computation.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/fm-test-run.sh --check-coverage

  # Two duration-balanced portable parallel shards of the Phase 2 proven-isolated
  # set only. Composition owner: bin/fm-test-run.sh (docs/fm-test-portable-shards.md).
  tests-portable-parallel-1:
    name: Behavior portable parallel 1
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Install the Pi package for the Pi extension tests
        run: |
          set -eu
          npm install -g @earendil-works/pi-coding-agent
          npm ls -g --depth 0 @earendil-works/pi-coding-agent
      - name: Run portable parallel shard 1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --lane portable-parallel-1 \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-1.json"
      - name: Upload shard 1 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-1
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-1.json
          if-no-files-found: warn

  tests-portable-parallel-2:
    name: Behavior portable parallel 2
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 2
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --lane portable-parallel-2 \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-2.json"
      - name: Upload shard 2 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-2
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-2.json
          if-no-files-found: warn

  # Required portable serial remainder: watcher, lock, AFK, tmux, daemon,
  # ambiguous, and other stateful tests.
  # Split across separate runners so no two of these stateful scripts ever share
  # a machine: each shard is still strictly serial in itself. Shard membership
  # and the shard count both belong to bin/fm-test-run.sh, which refuses a lane
  # whose "ofN" disagrees with it (docs/fm-test-portable-shards.md).
  tests-portable-serial:
    name: Behavior portable serial ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    strategy:
      # Every shard reports so one failure never hides another shard's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      # The Pi extension tests read the installed Pi package's own types and
      # runtime, so without it they gate-skip and pass silently. It is a public
      # npm package and needs no credential, so CI can hold the real thing.
      - name: Install the Pi package for the Pi extension tests
        run: |
          set -eu
          npm install -g @earendil-works/pi-coding-agent
          npm ls -g --depth 0 @earendil-works/pi-coding-agent
      - name: Run portable serial shard ${{ matrix.shard }}
        env:
          # job-total rather than a literal, so shrinking or growing the matrix
          # without matching bin/fm-test-run.sh is refused instead of quietly
          # leaving a shard of the required lane unrun.
          FM_SERIAL_LANE: portable-serial-${{ matrix.shard }}of${{ strategy.job-total }}
          FM_SERIAL_SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # The Pi package is installed above and CI provides npm and tsc, so
          # any missing typecheck prerequisite is a broken lane, not a valid skip.
          bin/fm-test-run.sh --lane "$FM_SERIAL_LANE" \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-serial-${FM_SERIAL_SHARD}.json"
      - name: Upload portable serial shard ${{ matrix.shard }} timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-serial-${{ matrix.shard }}
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-serial-${{ matrix.shard }}.json
          if-no-files-found: warn

  # The real-Herdr lane was removed in JarvisAIGeorge: Jarvis runs workers on
  # cmux or tmux. Herdr unit tests still run in the portable lanes; see
  # docs/jarvisharness.md "CI trim".

  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    # Fast tier: aggregation is seconds of work over lane artifacts.
    timeout-minutes: 5
    needs:
      - tests-portable-parallel-1
      - tests-portable-parallel-2
      - tests-portable-serial
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download lane timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fm-test-timing-*
          path: ${{ runner.temp }}/fm-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/fm-test-aggregate/fm-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-lane timing JSON found to aggregate"
            exit 0
          fi
          bin/fm-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-aggregate
          path: ${{ runner.temp }}/fm-test/fm-test-timing-aggregate.json
          if-no-files-found: warn

  macos-stock-bash:
    name: Stock macOS Bash snapshot compatibility
    runs-on: macos-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run snapshot consumers with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }

          shell_inventory="$RUNNER_TEMP/fm-shell-inventory"
          bin/fm-lint.sh --list-files > "$shell_inventory"
          parse_fail=0
          while IFS= read -r f; do
            /bin/bash -n "$f" || { echo "::error::stock macOS Bash 3.2 failed to parse $f"; parse_fail=1; }
          done < "$shell_inventory"
          [ "$parse_fail" -eq 0 ] || { echo "::error::stock macOS Bash 3.2 parse sweep failed"; exit 1; }

          command -v npm >/dev/null || { echo "::error::npm is required to install tasks-axi"; exit 1; }
          npm install -g tasks-axi@0.2.5 >/dev/null
          PATH="$(npm prefix -g)/bin:$PATH"
          export PATH
          command -v tasks-axi >/dev/null || { echo "::error::tasks-axi is required for the stock Bash regressions"; exit 1; }

          snapshot_output=$(/bin/bash tests/fm-fleet-snapshot-view.test.sh)
          printf '%s\n' "$snapshot_output"
          snapshot_count=$(printf '%s\n' "$snapshot_output" | grep -c '^ok - ')
          [ "$snapshot_count" -eq 18 ] || {
            echo "::error::expected 18 snapshot/fleet-view tests, got $snapshot_count"
            exit 1
          }

          bearings_output=$(/bin/bash tests/fm-bearings-snapshot.test.sh)
          printf '%s\n' "$bearings_output"
          bearings_count=$(printf '%s\n' "$bearings_output" | grep -c '^ok - ')
          [ "$bearings_count" -eq 59 ] || {
            echo "::error::expected 59 Bearings tests, got $bearings_count"
            exit 1
          }

          # The full public-followup suite is not a stock-bash snapshot; run only
          # the empty-lock register regression under real /bin/bash 3.2.
          pf_output=$(FM_TEST_ONLY=test_first_register_succeeds_with_empty_lock_list_under_bash32 \
            /bin/bash tests/fm-public-followup.test.sh)
          printf '%s\n' "$pf_output"
          pf_count=$(printf '%s\n' "$pf_output" | grep -c '^ok - ')
          [ "$pf_count" -eq 1 ] || {
            echo "::error::expected 1 public-followup bash 3.2 register regression, got $pf_count"
            exit 1
          }

          # Same shape for the watcher's churn-deferral regression: an already-
          # marked churn window expands an empty array that only stock Bash
          # treats as an unbound variable under set -u.
          churn_output=$(FM_TEST_ONLY=test_turn_ended_churn_existing_marker_absorbed \
            /bin/bash tests/fm-watch-triage.test.sh)
          printf '%s\n' "$churn_output"
          churn_count=$(printf '%s\n' "$churn_output" | grep -c '^ok - ')
          [ "$churn_count" -eq 1 ] || {
            echo "::error::expected 1 watcher churn-deferral bash 3.2 regression, got $churn_count"
            exit 1
          }

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    # Fast tier: the invariant checks are seconds-long file comparisons.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compatibility pointers must stay intact
        run: |
          set -eu
          [ ! -L CLAUDE.md ] || { echo "::error::CLAUDE.md must be a real @AGENTS.md pointer file, not a symlink"; exit 1; }
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' \
            '<!-- Points Claude at AGENTS.md via import; edit AGENTS.md, not this file. -->' \
            '@AGENTS.md' >"$tmp"
          cmp -s CLAUDE.md "$tmp" || { echo "::error::CLAUDE.md must be the canonical @AGENTS.md pointer"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
